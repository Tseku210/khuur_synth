# Publishes khuur_synth to pub.dev when a tag such as v0.2.0 is pushed, with
# pub.dev's automated publishing through GitHub's OIDC token. No secret is
# stored in the repository.
#
# It relies on these settings, all of which are on:
#
# - On https://pub.dev/packages/khuur_synth/admin, under Automated
#   publishing, publishing from GitHub Actions is enabled for the repository
#   Tseku210/khuur_synth with the tag pattern v{{version}}, and requires the
#   GitHub environment pub.dev.
# - The repository has the environment pub.dev, which only tags matching v*
#   may deploy from.
# - The repository variable PUB_AUTOMATED_PUBLISHING is true. Setting it to
#   anything else turns this workflow off.
#
# Then each release is a version bump and a CHANGELOG entry merged to main,
# followed by a tag that matches the pubspec's version.
#
#   git tag v0.2.0
#   git push origin v0.2.0

name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    if: vars.PUB_AUTOMATED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Sets up the OIDC token that pub.dev accepts.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub publish --force
