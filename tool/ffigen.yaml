# dart run ffigen --config tool/ffigen.yaml
name: FluidSynthBindings
description: The FluidSynth 2.6.2 calls khuur_synth makes.
output: ../lib/src/fluid/fluid_bindings.dart
headers:
  entry-points:
    - ../third_party/fluidsynth/include/fluidsynth.h
  include-directives:
    - ../third_party/fluidsynth/include/**
compiler-opts:
  - -I../third_party/fluidsynth/include
preamble: |
  // Generated by ffigen from FluidSynth 2.6.2's headers (LGPL-2.1-or-later).
  // ignore_for_file: type=lint
functions:
  include:
    - new_fluid_settings
    - delete_fluid_settings
    - fluid_settings_setint
    - fluid_settings_setstr
    - new_fluid_synth
    - delete_fluid_synth
    - new_fluid_audio_driver
    - delete_fluid_audio_driver
    - fluid_synth_sfload
    - fluid_synth_sfunload
    - fluid_synth_get_sfont_by_id
    - fluid_sfont_iteration_start
    - fluid_sfont_iteration_next
    - fluid_preset_get_name
    - fluid_preset_get_banknum
    - fluid_preset_get_num
    - fluid_synth_program_select
    - fluid_synth_unset_program
    - fluid_synth_noteon
    - fluid_synth_noteoff
    - fluid_synth_all_notes_off
    - fluid_synth_all_sounds_off
    - fluid_synth_set_gain
    - fluid_synth_reverb_on
    - fluid_synth_chorus_on
    - fluid_synth_set_reverb_group_roomsize
    - fluid_synth_set_reverb_group_damp
    - fluid_synth_set_reverb_group_width
    - fluid_synth_set_reverb_group_level
    - fluid_synth_get_active_voice_count
    - fluid_synth_write_float
    - fluid_synth_tune_notes
    - fluid_synth_activate_tuning
structs:
  include: []
  rename:
    '_(.*)': '$1'
unions:
  include: []
enums:
  include: []
macros:
  include: []
globals:
  include: []
typedefs:
  include: []
