name: khuur_synth
description: Plays SoundFonts on iOS and Android through FluidSynth, with cents on every note, reverb, chorus and offline rendering.
version: 0.1.0
repository: https://github.com/Tseku210/khuur_synth
issue_tracker: https://github.com/Tseku210/khuur_synth/issues

platforms:
  android:
  ios:

topics:
  - audio
  - midi
  - soundfont
  - synthesizer
  - fluidsynth

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
  fake_async: ^1.3.3
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        pluginClass: KhuurSynthPlugin
